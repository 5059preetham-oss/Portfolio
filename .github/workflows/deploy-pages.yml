name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Portfolio
          NEXT_PUBLIC_SITE_URL: https://5059preetham-oss.github.io/Portfolio

      - name: Verify GitHub Pages route files
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/about/index.html
          test -f out/blog/index.html
          test -f out/gallery/index.html
          test -f out/work/index.html
          test -f out/work/portfolio-website/index.html
          grep -q '/Portfolio/blog/' out/index.html
          grep -q '/Portfolio/_next/' out/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
