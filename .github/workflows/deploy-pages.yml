name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Portfolio
          NEXT_PUBLIC_SITE_URL: https://5059preetham-oss.github.io/Portfolio

      - name: Verify GitHub Pages route files
        run: |
          for route in \
            out/index.html \
            out/404.html \
            out/about/index.html \
            out/blog/index.html \
            out/gallery/index.html \
            out/work/index.html \
            out/work/portfolio-website/index.html; do
            test -f "$route" || { echo "Missing route file: $route"; exit 1; }
          done
          test -d src/app/blog/posts
          grep -Fq '/Portfolio/_next/' out/index.html || {
            echo "Missing /Portfolio/ asset prefix in homepage export"
            exit 1
          }
          if grep -Fq '__next_error__' out/index.html || grep -Fq 'name="robots" content="noindex"' out/index.html; then
            echo "Homepage export is a Next error document"
            exit 1
          fi
          grep -Fq 'PORTFOLIO' out/index.html || {
            echo "Homepage export is missing the PORTFOLIO marker"
            exit 1
          }
          grep -Fq 'Preetham' out/index.html || {
            echo "Homepage export is missing the Preetham marker"
            exit 1
          }
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
