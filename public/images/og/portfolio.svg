<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Preetham S portfolio</title>
  <desc id="desc">Abstract cyan and indigo grid pattern for the Preetham S portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#67e8f9" stroke-opacity=".15"/>
      <circle cx="3" cy="3" r="2" fill="#67e8f9" fill-opacity=".7"/>
    </pattern>
    <radialGradient id="glow" cx=".75" cy=".25" r=".7">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".3"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="930" cy="150" r="10" fill="#67e8f9"/>
  <circle cx="260" cy="480" r="7" fill="#fda4af"/>
  <text x="84" y="290" fill="#f8fafc" font-family="Arial, sans-serif" font-size="86" font-weight="700">Preetham S</text>
  <text x="90" y="360" fill="#67e8f9" font-family="monospace" font-size="24" letter-spacing="8">STUDENT / PORTFOLIO</text>
</svg>
